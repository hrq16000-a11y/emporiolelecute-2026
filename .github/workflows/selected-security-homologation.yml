name: Selected security homologation (isolated)
on:
  push:
    branches: ['qa/selected-security-20261124']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: selected-security-homologation
  cancel-in-progress: false
jobs:
  isolated:
    if: github.ref_name == 'qa/selected-security-20261124'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13
        with:
          version: 2.75.0
      # The CLI action installs its own Bun; restore the lockfile-compatible version afterwards.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Prepare dependencies without shared environment
        run: |
          rm -f .env .env.local .env.test .env.test.local
          bun install --frozen-lockfile
      - name: Isolate disposable containers and test process
        id: isolate
        run: |
          set -euo pipefail
          sudo iptables -S DOCKER-USER >/dev/null
          sudo iptables -I DOCKER-USER 1 -i br+ ! -o br+ -j REJECT
          sudo iptables -I DOCKER-USER 1 -i docker0 ! -o docker0 -j REJECT
          sudo iptables -I INPUT 1 -i br+ -m conntrack --ctstate NEW -j REJECT
          sudo iptables -I INPUT 1 -i docker0 -m conntrack --ctstate NEW -j REJECT
          sudo ip6tables -I FORWARD 1 -i br+ ! -o br+ -j REJECT
          sudo ip6tables -I FORWARD 1 -i docker0 ! -o docker0 -j REJECT
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin leleqa
          uid="$(id -u leleqa)"
          sudo iptables -I OUTPUT 1 -m owner --uid-owner "$uid" ! -d 127.0.0.1/32 -j REJECT
          sudo ip6tables -I OUTPUT 1 -m owner --uid-owner "$uid" -j REJECT
          sudo iptables -C OUTPUT -m owner --uid-owner "$uid" ! -d 127.0.0.1/32 -j REJECT
      - name: Start minimal local Auth and database without application migrations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/selected-stack"
          supabase init --workdir "$RUNNER_TEMP/selected-stack"
          sed -i 's/^project_id = .*/project_id = "lelecute-selected-qa"/' "$RUNNER_TEMP/selected-stack/supabase/config.toml"
          supabase start --workdir "$RUNNER_TEMP/selected-stack" -x edge-runtime,studio,imgproxy,logflare,vector,supavisor,realtime,storage-api > "$RUNNER_TEMP/stack-start.log" 2>&1
          docker exec -i supabase_db_lelecute-selected-qa psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/selected-security-fixture.sql
          supabase status --workdir "$RUNNER_TEMP/selected-stack" -o json > "$RUNNER_TEMP/local-status.json" 2>/dev/null
          sudo chown leleqa "$RUNNER_TEMP/local-status.json"
          sudo chmod 600 "$RUNNER_TEMP/local-status.json"
      - name: Run actual handlers with real local sessions and persistence
        run: |
          set -euo pipefail
          qa=/tmp/lelecute-selected-qa
          mkdir -p "$qa/scripts" "$qa/supabase/functions"
          cp scripts/selected-security-homologation.mjs "$qa/scripts/"
          cp -a node_modules "$qa/"
          for name in _shared calculate-shipping send-order-email track-visit; do
            cp -a "supabase/functions/$name" "$qa/supabase/functions/"
          done
          install -m 755 "$(command -v bun)" "$qa/bun"
          chmod -R a+rX "$qa"
          sudo cp "$RUNNER_TEMP/local-status.json" "$qa/local-status.json"
          sudo chown leleqa "$qa/local-status.json"
          sudo chmod 600 "$qa/local-status.json"
          sudo -u leleqa env -i PATH=/usr/bin:/bin RUN_SELECTED_LOCAL_QA=1 LOCAL_STATUS_FILE="$qa/local-status.json" "$qa/bun" --cwd "$qa" scripts/selected-security-homologation.mjs
      - name: Destroy disposable stack
        if: always() && steps.isolate.outcome == 'success'
        run: |
          supabase stop --workdir "$RUNNER_TEMP/selected-stack" --no-backup
          rm -f "$RUNNER_TEMP/local-status.json" "$RUNNER_TEMP/stack-start.log"
          sudo rm -rf /tmp/lelecute-selected-qa