name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Vitest (unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Shop safety gates (offline and read-only)
        run: |
          node --test scripts/check-storefront-guard.test.mjs
          node scripts/check-storefront-guard.mjs
      - run: bun run test --run
        env:
          CI: true

  e2e:
    name: Playwright (${{ matrix.project }})
    runs-on: ubuntu-24.04
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, tablet, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Install Playwright browser for the selected project
        run: |
          case "${{ matrix.project }}" in
            desktop-chromium) bunx playwright install --with-deps chromium ;;
            tablet|mobile) bunx playwright install --with-deps webkit ;;
            *) echo "Unsupported Playwright project: ${{ matrix.project }}"; exit 1 ;;
          esac
      - name: Force isolated Supabase endpoint for browser tests
        run: |
          cat > .env.local <<'EOF'
          VITE_SUPABASE_URL=http://127.0.0.1:54321
          VITE_SUPABASE_PROJECT_ID=local
          VITE_SUPABASE_PUBLISHABLE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQxNzY5MjAwLCJleHAiOjE3OTk1MzU2MDB9.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
          VITE_LOCAL_MODE=true
          EOF
      - name: Run Playwright (${{ matrix.project }})
        run: bunx playwright test --project=${{ matrix.project }}
        env:
          CI: true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          retention-days: 14
