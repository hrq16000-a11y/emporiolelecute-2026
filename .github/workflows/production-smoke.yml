name: Production smoke (read-only)

on:
  push:
    branches:
      - chore/production-smoke-phase2-20261126
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Production smoke (1440 / 768 / 390)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium once
        run: bunx playwright install --with-deps chromium
      - name: Run read-only Production smoke at 1440px
        run: bunx playwright test e2e/production-smoke.spec.ts --project=desktop-chromium --workers=1 --retries=0
        env:
          CI: "true"
          BASE_URL: https://emporiolelecute.com.br
          PW_NO_SERVER: "1"
      - name: Run read-only Production smoke at 768px
        run: bunx playwright test e2e/production-smoke.spec.ts --project=tablet-768 --workers=1 --retries=0
        env:
          CI: "true"
          BASE_URL: https://emporiolelecute.com.br
          PW_NO_SERVER: "1"
      - name: Run read-only Production smoke at 390px
        run: bunx playwright test e2e/production-smoke.spec.ts --project=mobile-390-chromium --workers=1 --retries=0
        env:
          CI: "true"
          BASE_URL: https://emporiolelecute.com.br
          PW_NO_SERVER: "1"
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-readonly
          path: |
            playwright-report
            test-results
          retention-days: 7
